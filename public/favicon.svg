<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="border-grad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="inner-grad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <!-- Outer rounded square - indigo border -->
  <rect x="2" y="2" width="44" height="44" rx="10" ry="10" fill="url(#border-grad)"/>
  <!-- Inner rounded square - dark slate fill -->
  <rect x="5" y="5" width="38" height="38" rx="7.5" ry="7.5" fill="url(#inner-grad)"/>
  <!-- T letter -->
  <text x="14" y="33" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="24" fill="#e2e8f0" letter-spacing="-1">T</text>
  <!-- I letter -->
  <text x="28" y="33" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="24" fill="#e2e8f0" letter-spacing="-1">I</text>
</svg>
